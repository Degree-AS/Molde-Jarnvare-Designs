<text x="40" y="1038" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#5b6270">Vanlige regler for hva som vises på nett gjelder alltid i bunn. Kunden redigerer ikke sortilogen. Alle brukere hos kunden ser alle delsortilogene.</text>
