<text x="120.0" y="229.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">Molde Jarnvare</text>
<rect x="20" y="325" width="1600" height="225" fill="#f7f8fb" stroke="#d5d9e4"/>
<rect x="20" y="325" width="200" height="225" fill="#1d2f87"/>
<text x="120.0" y="432.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Synk til</text>
<text x="120.0" y="454.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">nettbutikken</text>
