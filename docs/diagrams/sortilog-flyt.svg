<text x="120.0" y="679.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">MJ (System › Sortilog)</text>
<rect x="20" y="775" width="1600" height="225" fill="#f7f8fb" stroke="#d5d9e4"/>
<rect x="20" y="775" width="200" height="225" fill="#1d2f87"/>
<text x="120.0" y="882.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Nettbutikken:</text>
<text x="120.0" y="904.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff">kunden</text>
<rect x="260" y="145" width="380" height="135" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="450.0" y="185.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Selger legger inn vareavtale</text>
<text x="450.0" y="207.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">«Sortilog» på kundenummeret</text>
<text x="450.0" y="229.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">Én linje per vare, status Aktiv</text>
<text x="450.0" y="251.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">Ingen navn eller gruppering</text>
<rect x="1040" y="145" width="250" height="135" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="1165.0" y="196.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Vare tas ut</text>
<text x="1165.0" y="218.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">Linjen settes til</text>
<text x="1165.0" y="240.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">«Arkivert»</text>
<rect x="1330" y="145" width="250" height="135" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="1455.0" y="196.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Vare erstattes</text>
<text x="1455.0" y="218.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">Varen i linjen</text>
<text x="1455.0" y="240.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">byttes</text>
<rect x="260" y="380" width="250" height="115" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="385.0" y="432.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Leser bare linjer</text>
<text x="385.0" y="454.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">med status Aktiv</text>
<polygon points="690,362.5 815.0,437.5 690,512.5 565.0,437.5" fill="#fff6e3" stroke="#f5a623" stroke-width="2.5"/>
<text x="690" y="422.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2430">Vises varen på</text>
<text x="690" y="443.1" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2430">nett etter vanlige</text>
<text x="690" y="463.9" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2430">regler?</text>
<rect x="870" y="380" width="230" height="115" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="985.0" y="421.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Lagres i kundens</text>
<text x="985.0" y="443.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">sortilog</text>
<text x="985.0" y="465.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">per kunde og variant</text>
<rect x="1150" y="380" width="430" height="115" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="1365.0" y="421.3" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Fjernes ved neste synk</text>
<text x="1365.0" y="443.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">fra sortilogen og alle delsortiloger</text>
<text x="1365.0" y="465.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">(erstatningsvaren legges til)</text>
<text x="690" y="537" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#5b6270">Nei: vises ikke i sortilog, filter eller merkelapp</text>
<polygon points="400,577.0 550.0,662 400,747.0 250.0,662" fill="#fff6e3" stroke="#f5a623" stroke-width="2.5"/>
<text x="400" y="646.8" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2430">Trenger kunden ulike</text>
<text x="400" y="667.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2430">utvalg per avdeling</text>
<text x="400" y="688.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2430">eller type arbeid?</text>
<rect x="640" y="600" width="360" height="125" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="820.0" y="646.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">MJ lager delsortiloger</text>
<text x="820.0" y="668.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">og huker av varer fra</text>
<text x="820.0" y="690.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">kundens sortilog</text>
<rect x="1060" y="600" width="360" height="125" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1240.0" y="646.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Nye varer fra BC merkes</text>
<text x="1240.0" y="668.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">«Ikke fordelt» til MJ har</text>
<text x="1240.0" y="690.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">plassert dem</text>
<rect x="260" y="825" width="300" height="125" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="410.0" y="871.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Standard (de fleste):</text>
<text x="410.0" y="893.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">én sortilog for alle</text>
<text x="410.0" y="915.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">brukerne hos kunden</text>
<rect x="620" y="825" width="320" height="125" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="780.0" y="871.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Filter i nettbutikken</text>
<text x="780.0" y="893.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">«Kun varer i min sortilog»,</text>
<text x="780.0" y="915.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">eller ett valg per delsortilog</text>
<rect x="1000" y="825" width="270" height="125" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="1135.0" y="871.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Merkelapp «I sortilog»</text>
<text x="1135.0" y="893.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">og oversikt under</text>
<text x="1135.0" y="915.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">Min konto</text>
<rect x="1330" y="825" width="250" height="125" rx="10" fill="#ffffff" stroke="#1d2f87" stroke-width="2"/>
<text x="1455.0" y="871.4" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">Bestiller som</text>
<text x="1455.0" y="893.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2430">vanlig nettordre</text>
<text x="1455.0" y="915.6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#1f2430">(uten vareavtalenr.)</text>
