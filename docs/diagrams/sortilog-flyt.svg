<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1060" viewBox="0 0 1640 1060">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs>
<rect width="1640" height="1060" fill="#ffffff"/>
<text x="40" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2f87">Sortilog: fra BC til nettbutikken</text>
<text x="40" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#5b6270">Molde Jarnvare · utkast 12.11.2026 · én sortilog per kunde fra BC, delsortiloger bare for de få som trenger det</text>
<rect x="20" y="100" width="1600" height="225" fill="#eef1fa" stroke="#d5d9e4"/>
<rect x="20" y="100" width="200" height="225" fill="#1d2f87"/>
