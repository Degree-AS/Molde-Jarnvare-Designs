<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordrereferanse — Molde Jarnvare designsystem</title>

  <!-- Webfont (Source Sans 3 — webfont-erstatning for Aptos, jf. §5.1) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">

  <!-- Tokens og komponent -->
  <link rel="stylesheet" href="../../styles/tokens/index.css">
  <link rel="stylesheet" href="./order-reference.css">

  <style>
    /* Minimal preview-reset. Blir flyttet til src/styles/base/reset.css når den eksisterer. */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--ff-sans);
      color: var(--color-text-primary);
      background: var(--color-bg-page);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    img { max-width: 100%; }

    /* Etikett over hver variant — kun for denne previewen */
    .preview-label {
      max-width: var(--container-wide);
      margin: 0 auto;
      padding: var(--s-9) var(--gutter) var(--s-2);
      font-family: var(--ff-sans);
      font-size: var(--fs-overline);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-wider);
      text-transform: uppercase;
      color: var(--color-text-tertiary);
    }
    .preview-label:first-child { padding-top: var(--s-7); }
  </style>
</head>
<body>
  <p class="preview-label">Alle felt utfylt</p>
  <div style="max-width: var(--container-narrow); margin: 0 auto; padding: 0 var(--gutter);">
    <dl class="order-reference">
      <div class="order-reference__item"><dt class="order-reference__label">PO-nummer</dt><dd class="order-reference__value">PO-04812-1188</dd></div>
      <div class="order-reference__item"><dt class="order-reference__label">Din referanse</dt><dd class="order-reference__value">Prosjekt Hjelset verksted</dd></div>
      <div class="order-reference__item order-reference__item--full"><dt class="order-reference__label">Kommentar til ordren</dt><dd class="order-reference__value">Leveres ved port 3, bak verkstedhallen.
Ring Bjarte på 912 34 567 ved ankomst.</dd></div>
    </dl>
  </div>

  <p class="preview-label">Uten kommentar</p>
  <div style="max-width: var(--container-narrow); margin: 0 auto; padding: 0 var(--gutter);">
    <dl class="order-reference">
      <div class="order-reference__item"><dt class="order-reference__label">PO-nummer</dt><dd class="order-reference__value">PO-04812-1188</dd></div>
      <div class="order-reference__item"><dt class="order-reference__label">Din referanse</dt><dd class="order-reference__value order-reference__value--empty">Ingen</dd></div>
      <div class="order-reference__item order-reference__item--full"><dt class="order-reference__label">Kommentar til ordren</dt><dd class="order-reference__value order-reference__value--empty">Ingen</dd></div>
    </dl>
  </div>
</body>
</html>
