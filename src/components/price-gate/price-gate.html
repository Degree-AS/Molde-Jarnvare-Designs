<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Price gate — Molde Jarnvare designsystem</title>

  <!-- Webfont (Source Sans 3 — webfont-erstatning for Aptos, jf. §5.1) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">

  <!-- Tokens og komponent -->
  <link rel="stylesheet" href="../../styles/tokens/index.css">
  <link rel="stylesheet" href="./price-gate.css">

  <style>
    /* Minimal preview-reset. */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 0 var(--gutter) var(--s-9);
      font-family: var(--ff-sans);
      color: var(--color-text-primary);
      background: var(--color-bg-page);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Etikett over hver variant — kun for denne previewen */
    .preview-label {
      margin: 0;
      padding: var(--s-9) 0 var(--s-2);
      font-size: var(--fs-overline);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-wider);
      text-transform: uppercase;
      color: var(--color-text-tertiary);
    }
    .preview-label:first-child { padding-top: var(--s-7); }
  </style>
</head>
<body>

  <!-- Standard: der prisen ellers står på produktkort -->
  <p class="preview-label">Standard — produktkort (anonym)</p>
  <p class="price-gate"><a class="price-gate__link" href="#">Logg inn for å se priser</a></p>

  <!-- --quote: produkt flagget uten pris i BC -->
  <p class="preview-label">--quote — produkt uten pris i BC</p>
  <p class="price-gate price-gate--quote"><a class="price-gate__link" href="#">Kontakt oss for tilbud</a></p>

  <!-- --lg: PDP -->
  <p class="preview-label">--lg — produktside</p>
  <p class="price-gate price-gate--lg"><a class="price-gate__link" href="#">Logg inn for å se priser</a></p>

</body>
</html>
